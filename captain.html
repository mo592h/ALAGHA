<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كابتن الصالة - الاغا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Reem+Kufi+Fun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --stone-dark:#1a1814;--stone-mid:#2a2620;--stone-warm:#3d3830;--stone-lite:#544e44;
  --yellow:#f5c518;--yellow-dim:#c9a014;--yellow-pale:#fde87c;
  --red:#c0392b;--cream:#f0ead8;--muted:#9a9080;--line:#3d3830;--green:#6fa85f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--stone-dark);color:var(--cream);min-height:100vh;
  background-image:repeating-linear-gradient(-12deg,transparent 0,transparent 28px,rgba(255,255,255,.012) 28px,rgba(255,255,255,.012) 29px),linear-gradient(180deg,#1a1814,#1e1c18);}
.head{background:linear-gradient(180deg,#111009,#1a1814);border-bottom:2px solid var(--yellow-dim);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.head-left{display:flex;align-items:center;gap:12px}
.head-logo{width:44px;height:44px;border-radius:50%;border:2px solid var(--yellow-dim);overflow:hidden}
.head-logo img{width:100%;height:100%;object-fit:cover}
.head-title{font-family:'Reem Kufi Fun',sans-serif;font-size:22px;color:var(--yellow);letter-spacing:1px}
.hbtn{background:var(--stone-mid);border:1px solid var(--stone-lite);color:var(--muted);padding:8px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-family:'Tajawal';font-weight:700;transition:.2s}
.hbtn.on{border-color:var(--yellow-dim);color:var(--yellow)}
.login-wrap{max-width:360px;margin:80px auto;padding:36px 26px;background:var(--stone-mid);border:1px solid var(--stone-lite);border-top:3px solid var(--yellow-dim);border-radius:10px;text-align:center}
.login-logo{width:80px;height:80px;border-radius:50%;border:2px solid var(--yellow-dim);overflow:hidden;margin:0 auto 16px}
.login-logo img{width:100%;height:100%;object-fit:cover}
.login-wrap h2{font-family:'Reem Kufi Fun',sans-serif;color:var(--yellow);font-size:26px;margin-bottom:8px}
.login-wrap p{color:var(--muted);font-size:14px;margin-bottom:22px}
.inp{width:100%;background:var(--stone-warm);border:1px solid var(--line);color:var(--cream);padding:12px;border-radius:7px;font-family:'Tajawal';font-size:15px;margin-bottom:14px}
.inp:focus{outline:none;border-color:var(--yellow-dim)}
.bigbtn{background:var(--yellow);color:#111;border:none;width:100%;padding:15px;border-radius:8px;cursor:pointer;font-family:'Tajawal';font-weight:900;font-size:16px;letter-spacing:.5px}
.container{max-width:760px;margin:0 auto;padding:22px}
.page-title{font-family:'Reem Kufi Fun',sans-serif;color:var(--yellow);font-size:22px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.ocard{background:var(--stone-mid);border:1px solid var(--yellow-dim);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 0 18px rgba(245,197,24,.12)}
.ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.otable{font-weight:900;font-size:17px}
.otime{color:var(--muted);font-size:13px}
.wait-tag{background:rgba(245,197,24,.15);color:var(--yellow);border:1px solid rgba(245,197,24,.4);padding:4px 12px;border-radius:5px;font-size:13px;font-weight:700}
.item-line{display:flex;align-items:center;gap:8px;padding:8px;background:var(--stone-warm);border-radius:7px;margin-bottom:7px}
.item-qty{background:var(--stone-dark);border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;gap:8px;padding:3px}
.iq-btn{background:none;border:none;color:var(--yellow);cursor:pointer;width:24px;height:24px;font-size:16px}
.item-name{flex:1;font-size:14px;font-weight:500}
.item-price{color:var(--muted);font-size:13px}
.item-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:4px}
.add-item-row{display:flex;gap:8px;margin:10px 0}
.add-item-row select{flex:1;background:var(--stone-warm);border:1px solid var(--line);color:var(--cream);padding:10px;border-radius:7px;font-family:'Tajawal';font-size:14px}
.add-item-btn{background:var(--stone-warm);border:1px solid var(--yellow-dim);color:var(--yellow);padding:10px 16px;border-radius:7px;cursor:pointer;font-family:'Tajawal';font-weight:700;font-size:14px;white-space:nowrap}
.note-inp{width:100%;background:var(--stone-warm);border:1px solid var(--line);color:var(--cream);padding:10px;border-radius:7px;font-family:'Tajawal';font-size:14px;margin:8px 0}
.ototal{display:flex;justify-content:space-between;font-weight:900;color:var(--yellow);font-size:17px;margin:12px 0;padding-top:12px;border-top:1px solid var(--line)}
.obtns{display:flex;gap:10px}
.confirm-btn{flex:2;background:var(--green);color:#fff;border:none;padding:13px;border-radius:8px;cursor:pointer;font-family:'Tajawal';font-weight:900;font-size:15px}
.del-btn{flex:1;background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#e88;padding:13px;border-radius:8px;cursor:pointer;font-family:'Tajawal';font-weight:700;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty-icon{font-size:46px;opacity:.35;margin-bottom:12px}
.hide{display:none}
</style>
</head>

  <h2>كابتن الصالة</h2>
  <p>أدخل الرمز السري للوصول للطلبات</p>
  <input class="inp" id="pin" type="password" placeholder="الرمز السري" onkeydown="if(event.key==='Enter')login()">
  <button class="bigbtn" onclick="login()">دخول</button>
</div>

<div id="dash" class="hide">
  <div class="container">
    <div class="page-title">
      <span>🔔 طلبات بانتظار التأكيد (<span id="cnt">0</span>)</span>
    </div>
    <div class="page-sub">راجع كل طلب، عدّله إذا لزم، ثم أكّده ليصل للمطبخ — أو احذفه.</div>
    <div id="orders"></div>
  </div>
</div>

<script>
let PIN="",menu=[],pending=[],lastIds=new Set(),bellOn=true,firstLoad=true;
const fallback="";
const H=()=>({"Content-Type":"application/json","x-pin":PIN});

function playBell(){
  if(!bellOn)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const t=ctx.currentTime;
    [659,784,988,784].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type="sine";o.frequency.value=f;
      const st=t+i*.13;
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.35,st+.04);g.gain.exponentialRampToValueAtTime(.001,st+1.2);
      o.start(st);o.stop(st+1.2);
    });
  }catch(e){}
}
function toggleBell(){bellOn=!bellOn;const b=document.getElementById("bellBtn");b.textContent=bellOn?"🔔":"🔕";b.classList.toggle("on",bellOn)}

async function login(){
  PIN=document.getElementById("pin").value;
  const r=await(await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:PIN})})).json();
  if(r.ok){
    document.getElementById("loginWrap").classList.add("hide");
    document.getElementById("dash").classList.remove("hide");
    document.getElementById("bellBtn").classList.remove("hide");
    menu=await(await fetch("/api/menu")).json();
    loadPending();setInterval(loadPending,5000);
  }else alert("رمز خاطئ");
}

async function loadPending(){
  pending=await(await fetch("/api/pending",{headers:H()})).json();
  document.getElementById("cnt").textContent=pending.length;
  const ids=new Set(pending.map(o=>o.id));
  let hasNew=false;ids.forEach(id=>{if(!lastIds.has(id))hasNew=true});
  if(hasNew&&!firstLoad)playBell();
  lastIds=ids;firstLoad=false;
  render();
}

function render(){
  const el=document.getElementById("orders");
  if(!pending.length){el.innerHTML='<div class="empty"><div class="empty-icon">✅</div>لا توجد طلبات بانتظار التأكيد</div>';return}
  el.innerHTML=pending.map(o=>{
    const opts=menu.map(m=>`<option value="${m.id}">${m.name}</option>`).join("");
    return `
    <div class="ocard">
      <div class="ohead">
        <div><span class="otable">🪑 طاولة ${o.tableNo}</span> <span class="otime">🕐 ${o.time} · طلب #${o.id}</span></div>
        <span class="wait-tag">بانتظار</span>
      </div>
      ${o.items.map((it,idx)=>`
        <div class="item-line">
          <div class="item-qty">
            <button class="iq-btn" onclick="chgQty(${o.id},${idx},1)">+</button>
            <span>${it.qty}</span>
            <button class="iq-btn" onclick="chgQty(${o.id},${idx},-1)">−</button>
          </div>
          <span class="item-name">${it.name}</span>
          <span class="item-price">${(it.price*it.qty).toFixed(2)} د.أ</span>
          <button class="item-del" onclick="delItem(${o.id},${idx})">🗑️</button>
        </div>`).join("")}
      <div class="add-item-row">
        <select id="add-sel-${o.id}">${opts}</select>
        <button class="add-item-btn" onclick="addItem(${o.id})">+ إضافة صنف</button>
      </div>
      <input class="note-inp" id="note-${o.id}" placeholder="ملاحظات..." value="${(o.note||'').replace(/"/g,'&quot;')}" onchange="saveNote(${o.id})">
      <div class="ototal"><span>المجموع</span><span>${o.total.toFixed(2)} د.أ</span></div>
      <div class="obtns">
        <button class="confirm-btn" onclick="confirmOrder(${o.id})">✅ تأكيد وإرسال للمطبخ</button>
        <button class="del-btn" onclick="rejectOrder(${o.id})">🗑️ حذف</button>
      </div>
    </div>`;
  }).join("");
}

function findOrder(id){return pending.find(o=>o.id===id)}
function recalc(o){o.total=o.items.reduce((s,it)=>s+it.price*it.qty,0)}

async function pushEdit(o){
  await fetch("/api/orders/"+o.id+"/edit",{method:"PUT",headers:H(),body:JSON.stringify({items:o.items,note:o.note,total:o.total})});
  loadPending();
}
function chgQty(id,idx,d){
  const o=findOrder(id);if(!o)return;
  o.items[idx].qty+=d;
  if(o.items[idx].qty<=0)o.items.splice(idx,1);
  recalc(o);pushEdit(o);
}
function delItem(id,idx){
  const o=findOrder(id);if(!o)return;
  o.items.splice(idx,1);recalc(o);pushEdit(o);
}
function addItem(id){
  const o=findOrder(id);if(!o)return;
  const sel=document.getElementById("add-sel-"+id);
  const m=menu.find(x=>x.id==sel.value);if(!m)return;
  const price=(m.sizes&&m.sizes.filter(s=>s.on).length)?m.sizes.filter(s=>s.on)[0].price:(m.price||0);
  const ex=o.items.find(it=>it.name===m.name);
  if(ex)ex.qty++;else o.items.push({name:m.name,qty:1,price});
  recalc(o);pushEdit(o);
}
function saveNote(id){
  const o=findOrder(id);if(!o)return;
  o.note=document.getElementById("note-"+id).value;
  fetch("/api/orders/"+id+"/edit",{method:"PUT",headers:H(),body:JSON.stringify({note:o.note})});
}
async function confirmOrder(id){
  await fetch("/api/orders/"+id+"/confirm",{method:"POST",headers:H()});
  loadPending();
}
async function rejectOrder(id){
  if(!confirm("حذف الطلب؟ لن يصل للمطبخ."))return;
  await fetch("/api/orders/"+id,{method:"DELETE",headers:H()});
  loadPending();
}
</script>
</body>
</html>
