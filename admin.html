<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0805; --bg2: #160d07; --card: #1c1109; --card2: #241610;
  --gold: #d4a24e; --gold-bright: #f0c674; --gold-deep: #a67829;
  --cream: #f5e9d6; --muted: #9a8164; --line: #3a2616;
  --red: #c75c4a; --green: #6fa85f; --blue: #5b8db5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--cream); min-height: 100vh;
  background-image: radial-gradient(ellipse at 10% 0%, rgba(212,162,78,.07) 0%, transparent 45%); }

.head { background: linear-gradient(180deg, var(--card2), var(--bg2)); border-bottom: 1px solid var(--gold-deep); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.head-title { font-family: 'Aref Ruqaa', serif; font-size: 24px; color: var(--gold-bright); display: flex; align-items: center; gap: 10px; }
.head-actions { display: flex; gap: 8px; align-items: center; }
.bell-btn, .ghost-btn { background: var(--card); border: 1px solid var(--line); color: var(--muted); padding: 8px 14px; border-radius: 100px; cursor: pointer; font-size: 13px; font-family: 'Cairo'; font-weight: 600; transition: .2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.bell-btn.on { border-color: var(--gold-deep); color: var(--gold-bright); }
.ghost-btn:hover { border-color: var(--gold-deep); color: var(--cream); }

/* تسجيل الدخول */
.login-wrap { max-width: 380px; margin: 80px auto; padding: 40px 28px; background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 24px; text-align: center; }
.login-icon { font-size: 48px; margin-bottom: 16px; }
.login-wrap h2 { font-family: 'Aref Ruqaa', serif; color: var(--gold-bright); font-size: 28px; margin-bottom: 24px; }

/* تبويبات */
.tabs { display: flex; gap: 8px; padding: 16px 24px 0; max-width: 1200px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: var(--card); border: 1px solid var(--line); color: var(--muted); padding: 11px 22px; border-radius: 100px 100px 0 0; cursor: pointer; font-family: 'Cairo'; font-weight: 600; font-size: 15px; white-space: nowrap; transition: .2s; border-bottom: none; }
.tab.on { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a0e05; font-weight: 700; }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.page { display: none; }
.page.on { display: block; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* إحصائيات */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card { background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 18px; padding: 20px; position: relative; overflow: hidden; }
.stat-card::after { content: ""; position: absolute; top: -20px; left: -20px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(212,162,78,.12), transparent 70%); }
.stat-icon { font-size: 28px; margin-bottom: 10px; }
.stat-val { font-size: 32px; font-weight: 900; color: var(--gold-bright); font-family: 'Cairo'; }
.stat-label { color: var(--muted); font-size: 14px; margin-top: 4px; }
.top-items { background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
.top-items h3 { font-family: 'Aref Ruqaa', serif; color: var(--gold-bright); font-size: 22px; margin-bottom: 18px; }
.top-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.top-rank { width: 32px; height: 32px; border-radius: 50%; background: var(--card); border: 1px solid var(--gold-deep); color: var(--gold-bright); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.top-rank.gold { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a0e05; }
.top-bar-wrap { flex: 1; }
.top-bar-track { background: var(--bg); border-radius: 100px; height: 8px; overflow: hidden; margin-top: 6px; }
.top-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright)); border-radius: 100px; transition: width .8s; }
.top-count { color: var(--muted); font-size: 13px; }

/* أعمدة الطلبات والمنيو */
.cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
.col-head { font-family: 'Aref Ruqaa', serif; color: var(--gold-bright); font-size: 22px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.add-btn { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a0e05; border: none; padding: 9px 18px; border-radius: 100px; cursor: pointer; font-family: 'Cairo'; font-weight: 700; font-size: 14px; transition: .2s; }
.add-btn:active { transform: scale(.96); }

.order-card { background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; transition: .3s; }
.order-card.flash { border-color: var(--gold-bright); box-shadow: 0 0 24px rgba(240,198,116,.35); }
.order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.order-table { font-weight: 700; font-size: 16px; }
.order-time { color: var(--muted); font-size: 13px; }
.status-tag { padding: 5px 14px; border-radius: 100px; font-size: 13px; font-weight: 700; }
.st-new { background: rgba(199,92,74,.2); color: #e88; border: 1px solid rgba(199,92,74,.4); }
.st-prep { background: rgba(212,162,78,.2); color: var(--gold-bright); border: 1px solid rgba(212,162,78,.4); }
.st-done { background: rgba(111,168,95,.2); color: #8c8; border: 1px solid rgba(111,168,95,.4); }
.order-items { margin: 8px 0; }
.order-item-line { font-size: 14px; color: #d4b896; padding: 2px 0; }
.order-note { background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--gold); margin-top: 8px; }
.order-total { display: flex; justify-content: space-between; font-weight: 900; color: var(--gold-bright); font-size: 17px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.order-btns { display: flex; gap: 8px; margin-top: 12px; }
.obtn { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--muted); padding: 9px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; font-size: 13px; transition: .2s; }
.obtn:hover { border-color: var(--gold-deep); color: var(--cream); }
.obtn.del:hover { border-color: var(--red); color: var(--red); }

.menu-admin-card { background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.menu-admin-card img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
.menu-admin-info { flex: 1; min-width: 0; }
.menu-admin-name { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.menu-admin-meta { color: var(--muted); font-size: 13px; }
.mini-tag { font-size: 11px; padding: 2px 8px; border-radius: 100px; }
.mini-popular { background: rgba(212,162,78,.2); color: var(--gold-bright); }
.mini-out { background: rgba(199,92,74,.2); color: #e88; }
.icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 6px; transition: .2s; }
.icon-btn:hover { color: var(--gold-bright); }

.empty { text-align: center; color: var(--muted); padding: 50px 20px; }
.empty-icon { font-size: 40px; opacity: .4; margin-bottom: 10px; }

/* مودال */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; }
.overlay.show { display: flex; }
.modal { background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--gold-deep); border-radius: 22px; width: 100%; max-width: 460px; padding: 26px; max-height: 92vh; overflow-y: auto; animation: modalIn .3s; }
@keyframes modalIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
.modal h2 { font-family: 'Aref Ruqaa', serif; color: var(--gold-bright); font-size: 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.close-x { background: var(--card); border: 1px solid var(--line); color: var(--muted); cursor: pointer; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
.field-label { color: var(--muted); font-size: 14px; margin-bottom: 8px; display: block; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--cream); padding: 13px; border-radius: 13px; font-family: 'Cairo'; font-size: 15px; margin-bottom: 16px; transition: .2s; }
.inp:focus { outline: none; border-color: var(--gold-deep); }
.img-preview { width: 100%; height: 140px; object-fit: cover; border-radius: 14px; margin-bottom: 16px; display: none; border: 1px solid var(--line); }
.toggle-row { display: flex; gap: 12px; margin-bottom: 16px; }
.toggle-opt { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 13px; padding: 13px; cursor: pointer; text-align: center; font-weight: 600; font-size: 14px; color: var(--muted); transition: .2s; user-select: none; }
.toggle-opt.on { border-color: var(--gold-bright); color: var(--gold-bright); background: rgba(212,162,78,.1); }
.big-btn { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a0e05; border: none; width: 100%; padding: 16px; border-radius: 15px; cursor: pointer; font-family: 'Cairo'; font-weight: 700; font-size: 16px; transition: .2s; }
.big-btn:active { transform: scale(.98); }
.or-divider { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 12px; }

/* إدارة الأقسام */
.cat-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 100px; padding: 8px 14px; margin: 0 6px 10px 0; font-size: 14px; }
.cat-chip button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; }

@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="head">
  <div class="head-title">☕ لوحة الإدارة</div>
  <div class="head-actions" id="headActions" style="display:none">
    <button class="bell-btn on" id="bellBtn" onclick="toggleBell()">🔔</button>
    <a class="ghost-btn" href="/" target="_blank">المنيو ↗</a>
  </div>
</div>

<!-- تسجيل الدخول -->
<div class="login-wrap" id="loginWrap">
  <div class="login-icon">🔒</div>
  <h2>دخول الإدارة</h2>
  <input class="inp" id="pin" type="password" placeholder="الرمز السري" onkeydown="if(event.key==='Enter')login()">
  <button class="big-btn" onclick="login()">دخول</button>
</div>

<!-- اللوحة -->
<div id="dashboard" style="display:none">
  <div class="tabs">
    <button class="tab on" onclick="showTab('orders',this)">📋 الطلبات</button>
    <button class="tab" onclick="showTab('menu',this)">🍽️ المنيو</button>
    <button class="tab" onclick="showTab('stats',this)">📊 الإحصائيات</button>
    <button class="tab" onclick="showTab('settings',this)">⚙️ الإعدادات</button>
  </div>

  <div class="container">
    <!-- صفحة الطلبات -->
    <div class="page on" id="page-orders">
      <div class="col-head"><span>الطلبات الواردة (<span id="ordCount">0</span>)</span></div>
      <div id="orders"></div>
    </div>

    <!-- صفحة المنيو -->
    <div class="page" id="page-menu">
      <div class="col-head"><span>إدارة المنيو</span><button class="add-btn" onclick="openEdit()">+ صنف جديد</button></div>
      <div id="menuList"></div>
    </div>

    <!-- صفحة الإحصائيات -->
    <div class="page" id="page-stats">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="top-items">
        <h3>🏆 الأكثر مبيعاً</h3>
        <div id="topItems"></div>
      </div>
    </div>

    <!-- صفحة الإعدادات -->
    <div class="page" id="page-settings">
      <div class="col-head"><span>إعدادات المقهى</span></div>
      <div style="max-width:500px">
        <label class="field-label">اسم المقهى</label>
        <input class="inp" id="cafeName" placeholder="اسم المقهى">
        <button class="big-btn" style="margin-bottom:28px" onclick="saveCafeName()">حفظ الاسم</button>

        <label class="field-label">الأقسام</label>
        <div id="catsList" style="margin-bottom:12px"></div>
        <div style="display:flex;gap:8px">
          <input class="inp" id="newCat" placeholder="قسم جديد" style="margin-bottom:0" onkeydown="if(event.key==='Enter')addCat()">
          <button class="add-btn" onclick="addCat()">إضافة</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- مودال إضافة/تعديل -->
<div class="overlay" id="overlay" onclick="if(event.target.id==='overlay')closeEdit()">
  <div class="modal">
    <h2 id="modalTitle">صنف جديد <button class="close-x" onclick="closeEdit()">✕</button></h2>
    <img id="imgPreview" class="img-preview">
    <label class="field-label">اسم الصنف *</label>
    <input class="inp" id="f_name" placeholder="مثال: قهوة عربية">
    <label class="field-label">الوصف</label>
    <input class="inp" id="f_desc" placeholder="وصف قصير">
    <label class="field-label">السعر (د.أ) *</label>
    <input class="inp" id="f_price" type="number" step="0.25" min="0" placeholder="0.00">
    <label class="field-label">القسم</label>
    <select class="inp" id="f_cat"></select>
    <label class="field-label">الصورة</label>
    <input class="inp" id="f_img" placeholder="رابط الصورة" oninput="previewUrl(this.value)">
    <div class="or-divider">— أو ارفع من جهازك —</div>
    <input class="inp" id="f_file" type="file" accept="image/*" onchange="uploadImg(this)">
    <div class="toggle-row">
      <div class="toggle-opt on" id="tgl-avail" onclick="toggleOpt('avail')">✓ متوفر</div>
      <div class="toggle-opt" id="tgl-popular" onclick="toggleOpt('popular')">★ الأكثر طلباً</div>
    </div>
    <button class="big-btn" onclick="saveItem()">💾 حفظ</button>
  </div>
</div>

<script>
let PIN = "", menu = [], CATS = [], editId = null;
let lastNewIds = new Set(), bellOn = true, firstLoad = true;
let optAvail = true, optPopular = false;
const fallback = "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=200&q=80";
const H = () => ({ "Content-Type":"application/json", "x-pin": PIN });
const STATUS = { "جديد":["st-new","🆕"], "قيد التحضير":["st-prep","⏳"], "جاهز":["st-done","✅"] };

// ===== الجرس =====
function playBell() {
  if (!bellOn) return;
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const t = ctx.currentTime;
    [659, 784, 988, 784].forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.value = f;
      const st = t + i*0.13;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(0.35, st+0.04);
      g.gain.exponentialRampToValueAtTime(0.001, st+1.2);
      o.start(st); o.stop(st+1.2);
    });
  } catch(e){}
}
function toggleBell() {
  bellOn = !bellOn;
  const b = document.getElementById("bellBtn");
  b.textContent = bellOn ? "🔔" : "🔕";
  b.classList.toggle("on", bellOn);
}

// ===== الدخول =====
async function login() {
  PIN = document.getElementById("pin").value;
  const r = await (await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:PIN})})).json();
  if (r.ok) {
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("headActions").style.display = "flex";
    loadConfig(); loadMenu(); loadOrders();
    setInterval(loadOrders, 5000);
  } else alert("رمز خاطئ");
}

// ===== التبويبات =====
function showTab(name, btn) {
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  btn.classList.add("on");
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  document.getElementById("page-"+name).classList.add("on");
  if (name === "stats") loadStats();
}

// ===== الإعدادات =====
async function loadConfig() {
  const cfg = await (await fetch("/api/config")).json();
  CATS = cfg.cats;
  document.getElementById("cafeName").value = cfg.cafeName;
  renderCatsList();
  renderCatSelect();
}
function renderCatSelect() {
  document.getElementById("f_cat").innerHTML = CATS.map(c=>`<option>${c}</option>`).join("");
}
function renderCatsList() {
  document.getElementById("catsList").innerHTML = CATS.map(c=>
    `<span class="cat-chip">${c} <button onclick="removeCat('${c}')">✕</button></span>`).join("");
}
async function saveCafeName() {
  const name = document.getElementById("cafeName").value.trim();
  if (!name) return;
  await fetch("/api/config",{method:"PUT",headers:H(),body:JSON.stringify({cafeName:name})});
  alert("تم حفظ الاسم ✓");
}
async function addCat() {
  const c = document.getElementById("newCat").value.trim();
  if (!c || CATS.includes(c)) return;
  CATS.push(c);
  await fetch("/api/config",{method:"PUT",headers:H(),body:JSON.stringify({cats:CATS})});
  document.getElementById("newCat").value = "";
  renderCatsList(); renderCatSelect();
}
async function removeCat(c) {
  if (!confirm("حذف القسم "+c+"؟")) return;
  CATS = CATS.filter(x=>x!==c);
  await fetch("/api/config",{method:"PUT",headers:H(),body:JSON.stringify({cats:CATS})});
  renderCatsList(); renderCatSelect();
}

// ===== المنيو =====
async function loadMenu() {
  menu = await (await fetch("/api/menu")).json();
  const el = document.getElementById("menuList");
  el.innerHTML = menu.length ? menu.map(m=>`
    <div class="menu-admin-card">
      <img src="${m.img||fallback}" onerror="this.src='${fallback}'">
      <div class="menu-admin-info">
        <div class="menu-admin-name">
          ${m.name}
          ${m.popular?'<span class="mini-tag mini-popular">★</span>':''}
          ${!m.available?'<span class="mini-tag mini-out">غير متوفر</span>':''}
        </div>
        <div class="menu-admin-meta">${m.cat} · ${m.price.toFixed(2)} د.أ</div>
      </div>
      <button class="icon-btn" onclick="openEdit(${m.id})">✏️</button>
      <button class="icon-btn" onclick="delItem(${m.id})">🗑️</button>
    </div>`).join("") : '<div class="empty"><div class="empty-icon">🍽️</div>لا توجد أصناف بعد</div>';
}

// ===== الطلبات =====
async function loadOrders() {
  const orders = await (await fetch("/api/orders",{headers:H()})).json();
  document.getElementById("ordCount").textContent = orders.length;
  const newIds = new Set(orders.filter(o=>o.status==="جديد").map(o=>o.id));
  let hasNew = false;
  newIds.forEach(id=>{ if(!lastNewIds.has(id)) hasNew = true; });
  if (hasNew && !firstLoad) playBell();
  lastNewIds = newIds; firstLoad = false;

  const el = document.getElementById("orders");
  if (!orders.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>لا توجد طلبات بعد</div>'; return; }
  el.innerHTML = orders.map(o=>{
    const [cls,icon] = STATUS[o.status]||["st-new","🆕"];
    return `
    <div class="order-card ${o.status==='جديد'?'flash':''}">
      <div class="order-head">
        <div><span class="order-table">🪑 طاولة ${o.tableNo}</span> <span class="order-time">🕐 ${o.time}</span></div>
        <span class="status-tag ${cls}">${icon} ${o.status}</span>
      </div>
      <div class="order-items">
        ${o.items.map(it=>`<div class="order-item-line">${it.qty}× ${it.name} <span style="color:var(--muted)">— ${(it.price*it.qty).toFixed(2)} د.أ</span></div>`).join("")}
      </div>
      ${o.note?`<div class="order-note">📝 ${o.note}</div>`:''}
      <div class="order-total"><span>المجموع</span><span>${o.total.toFixed(2)} د.أ</span></div>
      <div class="order-btns">
        <button class="obtn" onclick="setStatus(${o.id},'قيد التحضير')">⏳ تحضير</button>
        <button class="obtn" onclick="setStatus(${o.id},'جاهز')">✅ جاهز</button>
        <button class="obtn del" onclick="delOrder(${o.id})">🗑️</button>
      </div>
    </div>`;}).join("");
}
async function setStatus(id, status) { await fetch("/api/orders/"+id,{method:"PUT",headers:H(),body:JSON.stringify({status})}); loadOrders(); }
async function delOrder(id) { await fetch("/api/orders/"+id,{method:"DELETE",headers:H()}); loadOrders(); }

// ===== الإحصائيات =====
async function loadStats() {
  const s = await (await fetch("/api/stats",{headers:H()})).json();
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-val">${s.totalOrders}</div><div class="stat-label">إجمالي الطلبات</div></div>
    <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">${s.todayOrders}</div><div class="stat-label">طلبات اليوم</div></div>
    <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-val">${s.revenue.toFixed(2)}</div><div class="stat-label">إجمالي الإيرادات (د.أ)</div></div>
    <div class="stat-card"><div class="stat-icon">💵</div><div class="stat-val">${s.todayRevenue.toFixed(2)}</div><div class="stat-label">إيرادات اليوم (د.أ)</div></div>
    <div class="stat-card"><div class="stat-icon">⏰</div><div class="stat-val">${s.pending}</div><div class="stat-label">طلبات جديدة</div></div>
  `;
  const max = s.topItems.length ? s.topItems[0][1] : 1;
  document.getElementById("topItems").innerHTML = s.topItems.length ? s.topItems.map(([name,cnt],i)=>`
    <div class="top-row">
      <div class="top-rank ${i===0?'gold':''}">${i+1}</div>
      <div class="top-bar-wrap">
        <div style="display:flex;justify-content:space-between"><b>${name}</b><span class="top-count">${cnt} طلب</span></div>
        <div class="top-bar-track"><div class="top-bar-fill" style="width:${(cnt/max*100)}%"></div></div>
      </div>
    </div>`).join("") : '<div class="empty">لا توجد بيانات بعد</div>';
}

// ===== مودال الصنف =====
function previewUrl(url) {
  const img = document.getElementById("imgPreview");
  if (url) { img.src = url; img.style.display = "block"; } else img.style.display = "none";
}
function toggleOpt(which) {
  if (which==="avail") { optAvail = !optAvail; document.getElementById("tgl-avail").classList.toggle("on",optAvail); }
  else { optPopular = !optPopular; document.getElementById("tgl-popular").classList.toggle("on",optPopular); }
}
function openEdit(id) {
  editId = id || null;
  renderCatSelect();
  const isEdit = !!id;
  document.getElementById("modalTitle").firstChild.textContent = isEdit ? "تعديل صنف " : "صنف جديد ";
  const m = isEdit ? menu.find(x=>x.id===id) : {name:"",descr:"",price:"",img:"",cat:CATS[0],available:true,popular:false};
  document.getElementById("f_name").value = m.name;
  document.getElementById("f_desc").value = m.descr||"";
  document.getElementById("f_price").value = m.price||"";
  document.getElementById("f_img").value = m.img||"";
  document.getElementById("f_cat").value = m.cat;
  document.getElementById("f_file").value = "";
  optAvail = m.available !== false; optPopular = !!m.popular;
  document.getElementById("tgl-avail").classList.toggle("on",optAvail);
  document.getElementById("tgl-popular").classList.toggle("on",optPopular);
  previewUrl(m.img||"");
  document.getElementById("overlay").classList.add("show");
}
function closeEdit() { document.getElementById("overlay").classList.remove("show"); document.getElementById("imgPreview").style.display="none"; }
async function uploadImg(input) {
  if (!input.files[0]) return;
  const fd = new FormData(); fd.append("img", input.files[0]);
  const r = await (await fetch("/api/upload",{method:"POST",headers:{"x-pin":PIN},body:fd})).json();
  document.getElementById("f_img").value = r.url;
  previewUrl(r.url);
}
async function saveItem() {
  const name = document.getElementById("f_name").value.trim();
  const price = parseFloat(document.getElementById("f_price").value);
  if (!name) { alert("أدخل اسم الصنف"); return; }
  if (!price && price!==0) { alert("أدخل السعر"); return; }
  const body = JSON.stringify({
    name, descr: document.getElementById("f_desc").value.trim(), price,
    img: document.getElementById("f_img").value.trim(),
    cat: document.getElementById("f_cat").value,
    available: optAvail, popular: optPopular
  });
  if (editId) await fetch("/api/menu/"+editId,{method:"PUT",headers:H(),body});
  else await fetch("/api/menu",{method:"POST",headers:H(),body});
  closeEdit(); loadMenu();
}
async function delItem(id) {
  if (!confirm("هل تريد حذف هذا الصنف؟")) return;
  await fetch("/api/menu/"+id,{method:"DELETE",headers:H()}); loadMenu();
}
</script>
