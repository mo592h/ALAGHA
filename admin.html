<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة - الاغا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Reem+Kufi+Fun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --stone-dark:#1a1814;--stone-mid:#2a2620;--stone-warm:#3d3830;--stone-lite:#544e44;
  --yellow:#f5c518;--yellow-dim:#c9a014;--yellow-pale:#fde87c;
  --red:#c0392b;--cream:#f0ead8;--muted:#9a9080;--line:#3d3830;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Tajawal',sans-serif;background:var(--stone-dark);color:var(--cream);min-height:100vh;
  background-image:
    repeating-linear-gradient(-12deg,transparent 0,transparent 28px,rgba(255,255,255,.012) 28px,rgba(255,255,255,.012) 29px),
    linear-gradient(180deg,#1a1814,#1e1c18);
}
.head{background:linear-gradient(180deg,#111009,#1a1814);border-bottom:2px solid var(--yellow-dim);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.head-left{display:flex;align-items:center;gap:12px}
.head-logo{width:44px;height:44px;border-radius:50%;border:2px solid var(--yellow-dim);overflow:hidden}
.head-logo img{width:100%;height:100%;object-fit:cover}
.head-title{font-family:'Reem Kufi Fun',sans-serif;font-size:22px;color:var(--yellow);letter-spacing:1px}
.head-actions{display:flex;gap:8px;align-items:center}
.hbtn{background:var(--stone-mid);border:1px solid var(--stone-lite);color:var(--muted);padding:8px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-family:'Tajawal';font-weight:700;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.hbtn.on{border-color:var(--yellow-dim);color:var(--yellow)}
.hbtn:hover{border-color:var(--yellow-dim);color:var(--cream)}

/* دخول */
.login-wrap{max-width:360px;margin:80px auto;padding:36px 26px;background:var(--stone-mid);border:1px solid var(--stone-lite);border-top:3px solid var(--yellow-dim);border-radius:10px;text-align:center}
.login-logo{width:80px;height:80px;border-radius:50%;border:2px solid var(--yellow-dim);overflow:hidden;margin:0 auto 16px}
.login-logo img{width:100%;height:100%;object-fit:cover}
.login-wrap h2{font-family:'Reem Kufi Fun',sans-serif;color:var(--yellow);font-size:26px;margin-bottom:22px}

/* تبويبات */
.tabs{display:flex;gap:6px;padding:16px 22px 0;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--stone-mid);border:1px solid var(--stone-lite);border-bottom:none;color:var(--muted);padding:10px 20px;border-radius:6px 6px 0 0;cursor:pointer;font-family:'Tajawal';font-weight:700;font-size:14px;white-space:nowrap;transition:.2s}
.tab.on{background:var(--yellow);color:#111;border-color:var(--yellow)}

.container{max-width:1200px;margin:0 auto;padding:22px}
.page{display:none}.page.on{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* الطلبات */
.orders-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ocol-head{font-family:'Reem Kufi Fun',sans-serif;font-size:19px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid}
.ocol-head.active{color:var(--yellow);border-color:var(--yellow-dim)}
.ocol-head.done{color:#7c7;border-color:rgba(100,180,100,.4)}
.clear-btn{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#e77;padding:6px 13px;border-radius:6px;cursor:pointer;font-family:'Tajawal';font-weight:700;font-size:13px;transition:.2s}
.clear-btn:hover{background:rgba(192,57,43,.3)}
.ocard{background:var(--stone-mid);border:1px solid var(--stone-lite);border-radius:10px;padding:15px;margin-bottom:12px;transition:.3s;position:relative}
.ocard::before{content:"";position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(-15deg,transparent 0,transparent 10px,rgba(255,255,255,.01) 10px,rgba(255,255,255,.01) 11px);pointer-events:none}
.ocard.flash{border-color:var(--yellow);box-shadow:0 0 20px rgba(245,197,24,.3)}
.ocard.done{border-color:rgba(100,180,100,.25);opacity:.85}
.ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.otable{font-weight:900;font-size:16px;letter-spacing:.3px}
.otime{color:var(--muted);font-size:13px}
.stag{padding:4px 13px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:.3px}
.st-new{background:rgba(192,57,43,.2);color:#e88;border:1px solid rgba(192,57,43,.4)}
.st-prep{background:rgba(245,197,24,.15);color:var(--yellow);border:1px solid rgba(245,197,24,.3)}
.st-done{background:rgba(100,180,100,.15);color:#7c7;border:1px solid rgba(100,180,100,.3)}
.oitem{font-size:14px;color:#d4cfc4;padding:2px 0}
.onote{background:var(--stone-warm);border-radius:6px;padding:7px 11px;font-size:13px;color:var(--yellow-dim);margin-top:8px}
.ototl{display:flex;justify-content:space-between;font-weight:900;color:var(--yellow);font-size:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.obtns{display:flex;gap:7px;margin-top:11px}
.obtn{flex:1;background:var(--stone-warm);border:1px solid var(--line);color:var(--muted);padding:9px;border-radius:6px;cursor:pointer;font-family:'Tajawal';font-weight:700;font-size:13px;transition:.2s}
.obtn:hover{border-color:var(--yellow-dim);color:var(--cream)}
.obtn.red:hover{border-color:var(--red);color:#e88}

/* المنيو */
.col-head{font-family:'Reem Kufi Fun',sans-serif;color:var(--yellow);font-size:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.addbtn{background:var(--yellow);color:#111;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-family:'Tajawal';font-weight:900;font-size:14px;transition:.2s}
.addbtn:active{transform:scale(.96)}
.mcard{background:var(--stone-mid);border:1px solid var(--stone-lite);border-radius:10px;padding:11px;display:flex;gap:11px;align-items:center;margin-bottom:9px}
.mcard img{width:58px;height:58px;border-radius:6px;object-fit:cover;flex-shrink:0}
.minfo{flex:1;min-width:0}
.mname{font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px}
.mmeta{color:var(--muted);font-size:13px}
.mtag{font-size:11px;padding:2px 8px;border-radius:4px}
.mt-pop{background:rgba(245,197,24,.2);color:var(--yellow)}
.mt-out{background:rgba(192,57,43,.2);color:#e88}
.ibtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:6px;transition:.2s}
.ibtn:hover{color:var(--yellow)}

/* إحصائيات */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.scard{background:var(--stone-mid);border:1px solid var(--stone-lite);border-top:3px solid var(--yellow-dim);border-radius:8px;padding:18px}
.sicon{font-size:26px;margin-bottom:8px}
.sval{font-size:30px;font-weight:900;color:var(--yellow)}
.slabel{color:var(--muted);font-size:13px;margin-top:3px}
.topbox{background:var(--stone-mid);border:1px solid var(--stone-lite);border-radius:8px;padding:20px}
.topbox h3{font-family:'Reem Kufi Fun',sans-serif;color:var(--yellow);font-size:20px;margin-bottom:16px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trank{width:30px;height:30px;border-radius:4px;background:var(--stone-warm);border:1px solid var(--yellow-dim);color:var(--yellow);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.trank.gold{background:var(--yellow);color:#111;border-color:var(--yellow)}
.tbar-wrap{flex:1}
.tbar-track{background:var(--stone-dark);border-radius:100px;height:7px;overflow:hidden;margin-top:5px}
.tbar-fill{height:100%;background:linear-gradient(90deg,var(--yellow-dim),var(--yellow));border-radius:100px;transition:width .8s}

/* إعدادات */
.cat-chip{display:inline-flex;align-items:center;gap:7px;background:var(--stone-warm);border:1px solid var(--stone-lite);border-radius:6px;padding:7px 13px;margin:0 6px 8px 0;font-size:14px;font-weight:700}
.cat-chip button{background:none;border:none;color:#e88;cursor:pointer;font-size:15px}

/* مودال */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.modal{background:var(--stone-mid);border:1px solid var(--stone-lite);border-top:3px solid var(--yellow-dim);border-radius:10px;width:100%;max-width:450px;padding:24px;max-height:92vh;overflow-y:auto;animation:mIn .3s}
@keyframes mIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal h2{font-family:'Reem Kufi Fun',sans-serif;color:var(--yellow);font-size:22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.cx{background:var(--stone-warm);border:1px solid var(--line);color:var(--muted);cursor:pointer;width:34px;height:34px;border-radius:6px;font-size:18px;display:grid;place-items:center}
.fl{color:var(--muted);font-size:14px;margin-bottom:7px;display:block;font-weight:700}
.inp{width:100%;background:var(--stone-warm);border:1px solid var(--line);color:var(--cream);padding:12px;border-radius:7px;font-family:'Tajawal';font-size:15px;margin-bottom:14px;transition:.2s}
.inp:focus{outline:none;border-color:var(--yellow-dim)}
.ipreview{width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:14px;display:none;border:1px solid var(--stone-lite)}
.togrow{display:flex;gap:10px;margin-bottom:14px}
.togopt{flex:1;background:var(--stone-warm);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;text-align:center;font-weight:700;font-size:14px;color:var(--muted);transition:.2s;user-select:none}
.togopt.on{border-color:var(--yellow);color:var(--yellow);background:rgba(245,197,24,.1)}
.bigbtn{background:var(--yellow);color:#111;border:none;width:100%;padding:15px;border-radius:8px;cursor:pointer;font-family:'Tajawal';font-weight:900;font-size:16px;transition:.2s;letter-spacing:.5px}
.bigbtn:active{transform:scale(.98)}
.ordiv{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 12px}
.empty{text-align:center;color:var(--muted);padding:45px 20px}
.empty-icon{font-size:38px;opacity:.35;margin-bottom:10px}
.hide{display:none}
@media(max-width:750px){.orders-grid{grid-template-columns:1fr}}
</style>
</head>

        <label class="fl">الأقسام</label>
        <div id="catsList" style="margin-bottom:12px"></div>

    </div>

  </div>

<script>
let PIN="",menu=[],CATS=[],editId=null;
let lastNewIds=new Set(),bellOn=true,firstLoad=true;
let optAvail=true,optPopular=false;
const fallback="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=200&q=80";
const H=()=>({"Content-Type":"application/json","x-pin":PIN});
const STATUS={"جديد":["st-new","🆕"],"قيد التحضير":["st-prep","⏳"],"جاهز":["st-done","✅"]};

function playBell(){
  if(!bellOn)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const t=ctx.currentTime;
    [659,784,988,784].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type="sine";o.frequency.value=f;
      const st=t+i*.13;
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.35,st+.04);g.gain.exponentialRampToValueAtTime(.001,st+1.2);
      o.start(st);o.stop(st+1.2);
    });
  }catch(e){}
}
function toggleBell(){bellOn=!bellOn;const b=document.getElementById("bellBtn");b.textContent=bellOn?"🔔":"🔕";b.classList.toggle("on",bellOn)}

async function login(){
  PIN=document.getElementById("pin").value;
  const r=await(await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:PIN})})).json();
  if(r.ok){
    document.getElementById("loginWrap").style.display="none";
    document.getElementById("dashboard").classList.remove("hide");
    document.getElementById("headActions").style.display="flex";
    loadConfig();loadMenu();loadOrders();setInterval(loadOrders,5000);
  }else alert("رمز خاطئ");
}

function showTab(name,btn){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));btn.classList.add("on");
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  document.getElementById("page-"+name).classList.add("on");
  if(name==="stats")loadStats();
}

async function loadConfig(){
  const cfg=await(await fetch("/api/config")).json();
  CATS=cfg.cats;
  document.getElementById("cafeName").value=cfg.cafeName;
  renderCatsList();renderCatSelect();
}
function renderCatSelect(){document.getElementById("f_cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("")}
function renderCatsList(){document.getElementById("catsList").innerHTML=CATS.map(c=>`<span class="cat-chip">${c}<button onclick="removeCat('${c}')">✕</button></span>`).join("")}
async function saveCafeName(){const n=document.getElementById("cafeName").value.trim();if(!n)return;await fetch("/api/config",{method:"PUT",headers:H(),body:JSON.stringify({cafeName:n})});alert("تم الحفظ ✓")}
async function addCat(){const c=document.getElementById("newCat").value.trim();if(!c||CATS.includes(c))return;CATS.push(c);await fetch("/api/config",{method:"PUT",headers:H(),body:JSON.stringify({cats:CATS})});document.getElementById("newCat").value="";renderCatsList();renderCatSelect()}
async function removeCat(c){if(!confirm("حذف القسم "+c+"؟"))return;CATS=CATS.filter(x=>x!==c);await fetch("/api/config",{method:"PUT",headers:H(),body:JSON.stringify({cats:CATS})});renderCatsList();renderCatSelect()}

async function loadMenu(){
  menu=await(await fetch("/api/menu")).json();
  document.getElementById("menuList").innerHTML=menu.length?menu.map(m=>`
    <div class="mcard">
      <img src="${m.img||fallback}" onerror="this.src='${fallback}'">
      <div class="minfo">
        <div class="mname">${m.name}
          ${m.popular?'<span class="mtag mt-pop">⭐</span>':''}
          ${!m.available?'<span class="mtag mt-out">غير متوفر</span>':''}
        </div>
        <div class="mmeta">${m.cat} · ${m.price.toFixed(2)} د.أ</div>
      </div>
      <button class="ibtn" onclick="openEdit(${m.id})">✏️</button>
      <button class="ibtn" onclick="delItem(${m.id})">🗑️</button>
    </div>`).join(""):'<div class="empty"><div class="empty-icon">🍽️</div>لا توجد أصناف بعد</div>';
}

function renderOCard(o,isDone){
  const[cls,icon]=STATUS[o.status]||["st-new","🆕"];
  const btns=isDone
    ?`<div class="obtns"><button class="obtn red" onclick="delOrder(${o.id})">🗑️ حذف</button></div>`
    :`<div class="obtns">
        <button class="obtn" onclick="setStatus(${o.id},'قيد التحضير')">⏳ تحضير</button>
        <button class="obtn" onclick="setStatus(${o.id},'جاهز')">✅ جاهز</button>
        <button class="obtn red" onclick="delOrder(${o.id})">🗑️</button>
      </div>`;
  return`<div class="ocard ${o.status==='جديد'?'flash':''} ${isDone?'done':''}">
    <div class="ohead">
      <div><span class="otable">🪑 طاولة ${o.tableNo}</span> <span class="otime">🕐 ${o.time}</span></div>
      <span class="stag ${cls}">${icon} ${o.status}</span>
    </div>
    ${o.items.map(it=>`<div class="oitem">${it.qty}× ${it.name} <span style="color:var(--muted)">— ${(it.price*it.qty).toFixed(2)} د.أ</span></div>`).join("")}
    ${o.note?`<div class="onote">📝 ${o.note}</div>`:''}
    <div class="ototl"><span>المجموع</span><span>${o.total.toFixed(2)} د.أ</span></div>
    ${btns}
  </div>`;
}

async function loadOrders(){
  const orders=await(await fetch("/api/orders",{headers:H()})).json();
  const active=orders.filter(o=>o.status!=="جاهز");
  const done=orders.filter(o=>o.status==="جاهز");
  const newIds=new Set(active.filter(o=>o.status==="جديد").map(o=>o.id));
  let hasNew=false;newIds.forEach(id=>{if(!lastNewIds.has(id))hasNew=true});
  if(hasNew&&!firstLoad)playBell();
  lastNewIds=newIds;firstLoad=false;
  document.getElementById("ordCount").textContent=active.length;
  document.getElementById("ordDoneCount").textContent=done.length;
  document.getElementById("orders-active").innerHTML=active.length?active.map(o=>renderOCard(o,false)).join(""):'<div class="empty"><div class="empty-icon">🎉</div>لا توجد طلبات نشطة</div>';
  document.getElementById("orders-done").innerHTML=done.length?done.map(o=>renderOCard(o,true)).join(""):'<div class="empty"><div class="empty-icon">📋</div>لا توجد طلبات جاهزة</div>';
}
async function setStatus(id,status){await fetch("/api/orders/"+id,{method:"PUT",headers:H(),body:JSON.stringify({status})});loadOrders()}
async function delOrder(id){await fetch("/api/orders/"+id,{method:"DELETE",headers:H()});loadOrders()}
async function clearDone(){
  if(!confirm("مسح جميع الطلبات الجاهزة؟"))return;
  const orders=await(await fetch("/api/orders",{headers:H()})).json();
  await Promise.all(orders.filter(o=>o.status==="جاهز").map(o=>fetch("/api/orders/"+o.id,{method:"DELETE",headers:H()})));
  loadOrders();
}

async function loadStats(){
  const s=await(await fetch("/api/stats",{headers:H()})).json();
  document.getElementById("statsGrid").innerHTML=`
    <div class="scard"><div class="sicon">📦</div><div class="sval">${s.totalOrders}</div><div class="slabel">إجمالي الطلبات</div></div>
    <div class="scard"><div class="sicon">📅</div><div class="sval">${s.todayOrders}</div><div class="slabel">طلبات اليوم</div></div>
    <div class="scard"><div class="sicon">💰</div><div class="sval">${s.revenue.toFixed(2)}</div><div class="slabel">إجمالي الإيرادات (د.أ)</div></div>
    <div class="scard"><div class="sicon">💵</div><div class="sval">${s.todayRevenue.toFixed(2)}</div><div class="slabel">إيرادات اليوم (د.أ)</div></div>
    <div class="scard"><div class="sicon">⏰</div><div class="sval">${s.pending}</div><div class="slabel">طلبات جديدة</div></div>`;
  const max=s.topItems.length?s.topItems[0][1]:1;
  document.getElementById("topItems").innerHTML=s.topItems.length?s.topItems.map(([name,cnt],i)=>`
    <div class="trow">
      <div class="trank ${i===0?'gold':''}">${i+1}</div>
      <div class="tbar-wrap">
        <div style="display:flex;justify-content:space-between"><b>${name}</b><span style="color:var(--muted);font-size:13px">${cnt} طلب</span></div>
        <div class="tbar-track"><div class="tbar-fill" style="width:${cnt/max*100}%"></div></div>
      </div>
    </div>`).join(""):'<div class="empty">لا توجد بيانات</div>';
}

function previewUrl(url){const img=document.getElementById("ipreview");if(url){img.src=url;img.style.display="block"}else img.style.display="none"}
function toggleOpt(w){if(w==="avail"){optAvail=!optAvail;document.getElementById("tgl-avail").classList.toggle("on",optAvail)}else{optPopular=!optPopular;document.getElementById("tgl-popular").classList.toggle("on",optPopular)}}
function openEdit(id){
  editId=id||null;renderCatSelect();
  document.getElementById("modalTitle").firstChild.textContent=id?"تعديل صنف ":"صنف جديد ";
  const m=id?menu.find(x=>x.id===id):{name:"",descr:"",price:"",img:"",cat:CATS[0],available:true,popular:false};
  document.getElementById("f_name").value=m.name;
  document.getElementById("f_desc").value=m.descr||"";
  document.getElementById("f_price").value=m.price||"";
  document.getElementById("f_img").value=m.img||"";
  document.getElementById("f_cat").value=m.cat;
  document.getElementById("f_file").value="";
  optAvail=m.available!==false;optPopular=!!m.popular;
  document.getElementById("tgl-avail").classList.toggle("on",optAvail);
  document.getElementById("tgl-popular").classList.toggle("on",optPopular);
  previewUrl(m.img||"");
  document.getElementById("overlay").classList.add("show");
}
function closeEdit(){document.getElementById("overlay").classList.remove("show");document.getElementById("ipreview").style.display="none"}
async function uploadImg(input){
  if(!input.files[0])return;
  const fd=new FormData();fd.append("img",input.files[0]);
  const r=await(await fetch("/api/upload",{method:"POST",headers:{"x-pin":PIN},body:fd})).json();
  document.getElementById("f_img").value=r.url;previewUrl(r.url);
}
async function saveItem(){
  const name=document.getElementById("f_name").value.trim();
  const price=parseFloat(document.getElementById("f_price").value);
  if(!name){alert("أدخل اسم الصنف");return}
  if(!price&&price!==0){alert("أدخل السعر");return}
  const body=JSON.stringify({name,descr:document.getElementById("f_desc").value.trim(),price,img:document.getElementById("f_img").value.trim(),cat:document.getElementById("f_cat").value,available:optAvail,popular:optPopular});
  if(editId)await fetch("/api/menu/"+editId,{method:"PUT",headers:H(),body});
  else await fetch("/api/menu",{method:"POST",headers:H(),body});
  closeEdit();loadMenu();
}
async function delItem(id){if(!confirm("حذف الصنف؟"))return;await fetch("/api/menu/"+id,{method:"DELETE",headers:H()});loadMenu()}
</script>
