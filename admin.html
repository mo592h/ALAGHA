<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة - قهوة الأصالة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; min-height: 100vh; background: #1a120b; color: #f5e9d9;
  background-image: radial-gradient(circle at 20% 10%, #2d1f12 0%, transparent 50%), radial-gradient(circle at 80% 90%, #25180d 0%, transparent 50%); }
.head { background: linear-gradient(180deg, #3a2817, #2a1c10); border-bottom: 2px solid #b5832e; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.logo { font-family: 'Reem Kufi'; font-size: 24px; font-weight: 700; color: #e6b15e; }
.adlink { color: #9c8369; text-decoration: none; font-size: 14px; border: 1px solid #4a3420; padding: 7px 14px; border-radius: 20px; }
.pinbox { max-width: 320px; margin: 80px auto; text-align: center; padding: 0 20px; }
.pinbox h2 { font-family: 'Reem Kufi'; color: #e6b15e; margin-bottom: 16px; }
.secrow { display: flex; gap: 12px; padding: 0 20px; }
.col { flex: 1; min-width: 0; }
.colh { font-family: 'Reem Kufi'; color: #e6b15e; font-size: 18px; margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.ordcard { background: #2d1f12; border: 1px solid #4a3420; border-radius: 16px; padding: 16px; margin-bottom: 14px; transition: .3s; }
.ordcard.new-flash { border-color: #e6b15e; box-shadow: 0 0 20px rgba(230,177,94,.4); }
.ohead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.tag { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.s0 { background: #5c2e2e; color: #ff9b9b; } .s1 { background: #5c4a2e; color: #ffd89b; } .s2 { background: #2e5c3a; color: #9bffb3; }
.total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; color: #e6b15e; margin-top: 8px; }
.sbtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.sbtn { flex: 1; background: #1a120b; border: 1px solid #4a3420; color: #d4b896; padding: 8px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; font-size: 13px; min-width: 70px; }
.admincard { background: #2d1f12; border: 1px solid #4a3420; border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.admincard img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
.iconbtn { background: none; border: none; color: #9c8369; cursor: pointer; font-size: 18px; padding: 4px; }
.navbtn { background: #e6b15e; color: #1a120b; border: none; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-family: 'Cairo'; font-weight: 700; font-size: 14px; }
.empty { text-align: center; color: #9c8369; padding: 40px 20px; }
.inp { width: 100%; background: #1a120b; border: 1px solid #4a3420; color: #f5e9d9; padding: 12px; border-radius: 12px; font-family: 'Cairo'; font-size: 15px; margin-bottom: 12px; }
.inp:focus { outline: none; border-color: #b5832e; }
.big { background: #e6b15e; color: #1a120b; border: none; width: 100%; padding: 14px; border-radius: 14px; cursor: pointer; font-family: 'Cairo'; font-weight: 800; font-size: 16px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #241710; border: 1px solid #4a3420; border-radius: 20px; width: 100%; max-width: 440px; padding: 24px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-family: 'Reem Kufi'; color: #e6b15e; font-size: 22px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.x { background: none; border: none; color: #9c8369; cursor: pointer; font-size: 22px; }
.hide { display: none; }
.bell-btn { background: #2d1f12; border: 1px solid #4a3420; color: #9c8369; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-family: 'Cairo'; }
.bell-btn.on { border-color: #e6b15e; color: #e6b15e; }
.img-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; display: none; }
@media (max-width: 700px) { .secrow { flex-direction: column; } }
</style>
</head>
<body>
<div class="head">
  <div class="logo">☕ لوحة الإدارة</div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="bell-btn" id="bellBtn" onclick="toggleBell()">🔔 الجرس</button>
    <a class="adlink" href="/">المنيو</a>
  </div>
</div>

<div class="pinbox" id="pinbox">
  <h2>🔒 دخول الإدارة</h2>
  <input class="inp" id="pin" type="password" placeholder="الرمز السري" onkeydown="if(event.key==='Enter')login()">
  <button class="big" onclick="login()">دخول</button>
</div>

<div class="secrow hide" id="panel">
  <div class="col">
    <div class="colh"><span>الطلبات الواردة (<span id="ordCount">0</span>)</span></div>
    <div id="orders"></div>
  </div>
  <div class="col">
    <div class="colh"><span>إدارة المنيو</span><button class="navbtn" onclick="openEdit()">+ صنف</button></div>
    <div id="menuList"></div>
  </div>
</div>

<!-- مودال إضافة/تعديل صنف -->
<div class="overlay" id="overlay" onclick="if(event.target.id==='overlay')closeEdit()">
  <div class="modal">
    <h2 id="modalTitle">صنف جديد <button class="x" onclick="closeEdit()">✕</button></h2>
    <img id="imgPreview" class="img-preview">
    <input class="inp" id="f_name" placeholder="اسم الصنف *">
    <input class="inp" id="f_desc" placeholder="الوصف">
    <input class="inp" id="f_price" type="number" step="0.25" min="0" placeholder="السعر *">
    <select class="inp" id="f_cat">
      <option>ساخن</option><option>بارد</option><option>حلويات</option><option>أخرى</option>
    </select>
    <input class="inp" id="f_img" placeholder="رابط صورة (اختياري)" oninput="previewUrl(this.value)">
    <div style="color:#9c8369;font-size:13px;margin-bottom:8px;text-align:center">— أو —</div>
    <input class="inp" id="f_file" type="file" accept="image/*" onchange="uploadImg(this)">
    <button class="big" onclick="saveItem()">💾 حفظ</button>
  </div>
</div>

<script>
let PIN = "", menu = [], editId = null;
let lastOrderIds = new Set();
let bellOn = true;
const STATUS = { "جديد":"s0", "قيد التحضير":"s1", "جاهز":"s2" };
const fallback = "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=200&q=80";
const H = () => ({ "Content-Type":"application/json", "x-pin": PIN });

// ===== صوت الجرس =====
function playBell() {
  if (!bellOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    // نغمة الجرس: oscillator + gain envelope
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t + i * 0.15);
      gain.gain.linearRampToValueAtTime(0.4, t + i * 0.15 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 1.5);
      osc.start(t + i * 0.15);
      osc.stop(t + i * 0.15 + 1.5);
    });
  } catch(e) {}
}

function toggleBell() {
  bellOn = !bellOn;
  const btn = document.getElementById("bellBtn");
  btn.textContent = bellOn ? "🔔 الجرس" : "🔕 الجرس";
  btn.classList.toggle("on", bellOn);
}

// ===== تسجيل الدخول =====
async function login() {
  PIN = document.getElementById("pin").value;
  const r = await (await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:PIN})})).json();
  if (r.ok) {
    document.getElementById("pinbox").classList.add("hide");
    document.getElementById("panel").classList.remove("hide");
    document.getElementById("bellBtn").classList.add("on");
    loadAll();
    setInterval(loadOrders, 5000);
  } else alert("رمز خاطئ");
}

async function loadAll() { await loadMenu(); await loadOrders(); }

// ===== المنيو =====
async function loadMenu() {
  menu = await (await fetch("/api/menu")).json();
  document.getElementById("menuList").innerHTML = menu.length ? menu.map(m=>`
    <div class="admincard">
      <img src="${m.img||fallback}" onerror="this.src='${fallback}'">
      <div style="flex:1;min-width:0">
        <b>${m.name}</b>
        <div style="color:#9c8369;font-size:13px">${m.cat} · ${m.price.toFixed(2)} د.أ</div>
        <div style="color:#9c8369;font-size:12px">${m.descr||''}</div>
      </div>
      <button class="iconbtn" title="تعديل" onclick="openEdit(${m.id})">✏️</button>
      <button class="iconbtn" title="حذف" onclick="delItem(${m.id})">🗑️</button>
    </div>`).join("") : '<div class="empty">لا توجد أصناف</div>';
}

// ===== الطلبات مع الجرس =====
async function loadOrders() {
  const orders = await (await fetch("/api/orders",{headers:H()})).json();
  document.getElementById("ordCount").textContent = orders.length;

  // جرس للطلبات الجديدة
  const newIds = new Set(orders.filter(o=>o.status==="جديد").map(o=>o.id));
  let hasNew = false;
  newIds.forEach(id => { if (!lastOrderIds.has(id)) hasNew = true; });
  if (hasNew && lastOrderIds.size > 0) playBell();
  lastOrderIds = newIds;

  const el = document.getElementById("orders");
  if (!orders.length) { el.innerHTML = '<div class="empty">لا توجد طلبات بعد</div>'; return; }
  el.innerHTML = orders.map(o=>`
    <div class="ordcard ${o.status==='جديد'?'new-flash':''}">
      <div class="ohead">
        <div><b>طاولة ${o.tableNo}</b> <span style="color:#9c8369;font-size:13px">🕐 ${o.time}</span></div>
        <span class="tag ${STATUS[o.status]||'s0'}">${o.status}</span>
      </div>
      ${o.items.map(it=>`<div style="font-size:14px;color:#d4b896">${it.qty}× ${it.name} <span style="color:#9c8369">(${(it.price*it.qty).toFixed(2)} د.أ)</span></div>`).join("")}
      <div class="total"><span>المجموع</span><span>${o.total.toFixed(2)} د.أ</span></div>
      <div class="sbtns">
        <button class="sbtn" onclick="setStatus(${o.id},'قيد التحضير')">⏳ تحضير</button>
        <button class="sbtn" onclick="setStatus(${o.id},'جاهز')">✅ جاهز</button>
        <button class="sbtn" onclick="delOrder(${o.id})">🗑️ حذف</button>
      </div>
    </div>`).join("");
}

async function setStatus(id, status) {
  await fetch("/api/orders/"+id,{method:"PUT",headers:H(),body:JSON.stringify({status})});
  loadOrders();
}
async function delOrder(id) {
  await fetch("/api/orders/"+id,{method:"DELETE",headers:H()});
  loadOrders();
}

// ===== إضافة/تعديل صنف =====
async function delItem(id) {
  if(!confirm("هل تريد حذف هذا الصنف؟")) return;
  await fetch("/api/menu/"+id,{method:"DELETE",headers:H()});
  loadMenu();
}

function previewUrl(url) {
  const img = document.getElementById("imgPreview");
  if (url) { img.src = url; img.style.display = "block"; }
  else img.style.display = "none";
}

function openEdit(id) {
  editId = id || null;
  const isEdit = !!id;
  document.getElementById("modalTitle").firstChild.textContent = isEdit ? "تعديل صنف " : "صنف جديد ";
  const m = isEdit ? menu.find(x=>x.id===id) : {name:"",descr:"",price:"",img:"",cat:"ساخن"};
  document.getElementById("f_name").value = m.name;
  document.getElementById("f_desc").value = m.descr||"";
  document.getElementById("f_price").value = m.price||"";
  document.getElementById("f_img").value = m.img||"";
  document.getElementById("f_cat").value = m.cat;
  document.getElementById("f_file").value = "";
  previewUrl(m.img||"");
  document.getElementById("overlay").style.display = "flex";
}

function closeEdit() {
  document.getElementById("overlay").style.display = "none";
  document.getElementById("imgPreview").style.display = "none";
}

async function uploadImg(input) {
  if (!input.files[0]) return;
  const fd = new FormData();
  fd.append("img", input.files[0]);
  const r = await (await fetch("/api/upload",{method:"POST",headers:{"x-pin":PIN},body:fd})).json();
  document.getElementById("f_img").value = r.url;
  previewUrl(r.url);
}

async function saveItem() {
  const name = document.getElementById("f_name").value.trim();
  const price = parseFloat(document.getElementById("f_price").value);
  if (!name) { alert("أدخل اسم الصنف"); return; }
  if (!price) { alert("أدخل السعر"); return; }
  const body = JSON.stringify({
    name,
    descr: document.getElementById("f_desc").value.trim(),
    price,
    img: document.getElementById("f_img").value.trim(),
    cat: document.getElementById("f_cat").value,
  });
  if (editId) await fetch("/api/menu/"+editId,{method:"PUT",headers:H(),body});
  else await fetch("/api/menu",{method:"POST",headers:H(),body});
  closeEdit();
  loadMenu();
}
</script>
</body>
</html>
