<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قهوة الأصالة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; min-height: 100vh; background: #1a120b; color: #f5e9d9;
  background-image: radial-gradient(circle at 20% 10%, #2d1f12 0%, transparent 50%), radial-gradient(circle at 80% 90%, #25180d 0%, transparent 50%); }
.head { background: linear-gradient(180deg, #3a2817, #2a1c10); border-bottom: 2px solid #b5832e; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.logo { font-family: 'Reem Kufi'; font-size: 26px; font-weight: 700; color: #e6b15e; }
.adlink { color: #9c8369; text-decoration: none; font-size: 14px; border: 1px solid #4a3420; padding: 7px 14px; border-radius: 20px; }
.cats { display: flex; gap: 8px; padding: 16px 20px; overflow-x: auto; }
.cat { background: #2a1c10; border: 1px solid #4a3420; color: #d4b896; padding: 9px 20px; border-radius: 30px; cursor: pointer; white-space: nowrap; font-family: 'Cairo'; font-weight: 600; font-size: 15px; }
.cat.on { background: #e6b15e; color: #1a120b; border-color: #e6b15e; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 8px 20px 100px; }
.card { background: linear-gradient(180deg, #2d1f12, #241710); border: 1px solid #4a3420; border-radius: 18px; overflow: hidden; transition: .25s; }
.card:hover { transform: translateY(-4px); border-color: #b5832e; }
.card img { width: 100%; height: 160px; object-fit: cover; }
.cbody { padding: 14px; }
.cname { font-size: 18px; font-weight: 800; }
.cdesc { font-size: 13px; color: #9c8369; margin: 4px 0 10px; }
.cfoot { display: flex; align-items: center; justify-content: space-between; }
.price { color: #e6b15e; font-weight: 800; font-size: 18px; }
.price small { font-size: 12px; font-weight: 400; }
.add, .qbtn { background: #b5832e; color: #1a120b; border: none; border-radius: 12px; cursor: pointer; display: grid; place-items: center; }
.add { width: 38px; height: 38px; }
.qty { display: flex; align-items: center; gap: 10px; }
.qbtn { background: #4a3420; color: #e6b15e; width: 30px; height: 30px; border-radius: 8px; font-size: 18px; }
.qty span { font-weight: 800; min-width: 18px; text-align: center; }
.fab { position: fixed; bottom: 20px; left: 20px; background: #e6b15e; color: #1a120b; border: none; padding: 14px 22px; border-radius: 30px; cursor: pointer; font-family: 'Cairo'; font-weight: 800; font-size: 16px; display: none; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(230,177,94,.4); z-index: 40; }
.badge { background: #1a120b; color: #e6b15e; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font-size: 13px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
.sheet { background: #241710; border: 1px solid #4a3420; border-radius: 24px 24px 0 0; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 24px; }
.sheet h2 { font-family: 'Reem Kufi'; color: #e6b15e; font-size: 22px; margin-bottom: 16px; display: flex; justify-content: space-between; }
.crow { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #3a2817; }
.inp { width: 100%; background: #1a120b; border: 1px solid #4a3420; color: #f5e9d9; padding: 12px; border-radius: 12px; font-family: 'Cairo'; font-size: 15px; margin-bottom: 12px; }
.big { background: #e6b15e; color: #1a120b; border: none; width: 100%; padding: 14px; border-radius: 14px; cursor: pointer; font-family: 'Cairo'; font-weight: 800; font-size: 16px; }
.total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; color: #e6b15e; margin: 16px 0; }
.x { background: none; border: none; color: #9c8369; cursor: pointer; font-size: 22px; }
.empty { text-align: center; color: #9c8369; padding: 60px 20px; }
.toast { position: fixed; top: 80px; right: 50%; transform: translateX(50%); background: #2e5c3a; color: #9bffb3; padding: 14px 24px; border-radius: 30px; z-index: 60; display: none; font-weight: 600; }
</style>
</head>
<body>
<div class="head">
  <div class="logo">☕ قهوة الأصالة</div>
  <a class="adlink" href="/admin.html">الإدارة</a>
</div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<button class="fab" id="fab" onclick="openCart()">🛒 السلة <span class="badge" id="badge">0</span></button>

<div class="overlay" id="overlay" onclick="closeCart(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2>سلة الطلبات <button class="x" onclick="closeCart()">✕</button></h2>
    <div id="cartItems"></div>
    <div class="total"><span>المجموع</span><span id="cartTotal">0.00 د.أ</span></div>
    <input class="inp" id="tableNo" placeholder="رقم الطاولة (اختياري)">
    <button class="big" onclick="submitOrder()">تأكيد الطلب</button>
  </div>
</div>
<div class="toast" id="toast">تم إرسال طلبك بنجاح ✓</div>

<script>
const CATS = ["ساخن", "بارد", "حلويات", "أخرى"];
let menu = [], cart = {}, activeCat = "ساخن";
const fallback = "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&q=80";

async function load() {
  menu = await (await fetch("/api/menu")).json();
  renderCats();
  render();
}
function renderCats() {
  document.getElementById("cats").innerHTML = CATS.map(c =>
    `<button class="cat ${c===activeCat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c) { activeCat = c; renderCats(); render(); }
function render() {
  const items = menu.filter(m => m.cat === activeCat);
  const g = document.getElementById("grid");
  if (!items.length) { g.innerHTML = '<div class="empty">لا توجد أصناف في هذا القسم</div>'; return; }
  g.innerHTML = items.map(m => `
    <div class="card">
      <img src="${m.img||fallback}" onerror="this.src='${fallback}'">
      <div class="cbody">
        <div class="cname">${m.name}</div>
        <div class="cdesc">${m.descr||''}</div>
        <div class="cfoot">
          <div class="price">${m.price.toFixed(2)} <small>د.أ</small></div>
          ${cart[m.id] ? `<div class="qty">
            <button class="qbtn" onclick="dec(${m.id})">−</button>
            <span>${cart[m.id]}</span>
            <button class="qbtn" onclick="inc(${m.id})">+</button></div>`
          : `<button class="add" onclick="inc(${m.id})">+</button>`}
        </div>
      </div>
    </div>`).join("");
}
function inc(id) { cart[id] = (cart[id]||0)+1; render(); updateFab(); }
function dec(id) { if (cart[id]>1) cart[id]--; else delete cart[id]; render(); updateFab(); }
function count() { return Object.values(cart).reduce((a,b)=>a+b,0); }
function total() { return Object.entries(cart).reduce((s,[id,q])=>{const it=menu.find(m=>m.id==id);return s+(it?it.price*q:0);},0); }
function updateFab() {
  const c = count();
  document.getElementById("fab").style.display = c ? "flex" : "none";
  document.getElementById("badge").textContent = c;
}
function openCart() {
  const ci = document.getElementById("cartItems");
  ci.innerHTML = Object.entries(cart).map(([id,q])=>{const it=menu.find(m=>m.id==id);return `
    <div class="crow"><div><b>${it.name}</b><div style="color:#9c8369;font-size:13px">${it.price.toFixed(2)} × ${q}</div></div>
    <div class="qty"><button class="qbtn" onclick="dec(${id});openCart()">−</button><span>${q}</span><button class="qbtn" onclick="inc(${id});openCart()">+</button></div></div>`;}).join("");
  document.getElementById("cartTotal").textContent = total().toFixed(2) + " د.أ";
  document.getElementById("overlay").style.display = "flex";
}
function closeCart(e) { if (!e || e.target.id === "overlay") document.getElementById("overlay").style.display = "none"; }
async function submitOrder() {
  if (!count()) return;
  const items = Object.entries(cart).map(([id,q])=>{const it=menu.find(m=>m.id==id);return {name:it.name,qty:q,price:it.price};});
  await fetch("/api/orders", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({tableNo:document.getElementById("tableNo").value, items, total: total()}) });
  cart = {}; document.getElementById("tableNo").value = "";
  closeCart(); render(); updateFab();
  const t = document.getElementById("toast"); t.style.display = "block"; setTimeout(()=>t.style.display="none", 2500);
}
load();
</script>
</body>
</html>
